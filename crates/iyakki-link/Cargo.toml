[package]
name = "iyakki-link"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The remote-desktop client link: HTTPS with a pinned certificate, WebSocket framing, the picture codec. Shared by the agent and iyakki-connect."

[dependencies]
iyakki-sec.workspace = true
log.workspace = true
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
miniz_oxide = "0.8"
tiny-skia = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# device sign-in (sigscheme.rs): Ed25519 signing and verification; the bytes come from iyakki-sec, so no random-number feature
ed25519-dalek = { version = "3", default-features = false, features = ["zeroize"] }
