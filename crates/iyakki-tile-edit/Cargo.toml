[package]
name = "iyakki-tile-edit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The code editor as a WASM tile, first slice (F-WEB-54): a scratch buffer on the editing engine iyakki-edit. tile.wasm is the wasm32 build."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
iyakki-tile-kit = { path = "../iyakki-tile-kit" }
iyakki-edit = { path = "../iyakki-edit" }
serde_json = "1"

[dev-dependencies]
iyakki-tile-host = { path = "../iyakki-tile-host" }
