[package]
name = "iyakki-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The reader browser's engine: web addresses, a forgiving HTML parser, a page model of headings, text, lists, links and tables, and a loader that follows redirects under a host policy. No JavaScript; two small dependencies (miniz_oxide, for the PNG reader, and serde, to hand a page model across the core socket)."

[dependencies]
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive", "rc"] }

[dev-dependencies]
serde_json = "1"
