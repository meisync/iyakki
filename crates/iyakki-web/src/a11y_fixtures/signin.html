<!doctype html>
<html lang="en"><head><title>Sign in</title></head>
<body>
<main>
  <h1>Sign in</h1>
  <div role="alert">Please fix the two problems below.</div>
  <form action="/login" method="post" aria-label="Account">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required aria-invalid="true" aria-describedby="email-err">
    <span id="email-err">Enter an email address with an at sign.</span>
    <label>Password <input name="pw" type="password" required minlength="8"></label>
    <input name="nick" aria-label="Nickname" placeholder="optional">
    <fieldset><legend>Plan</legend>
      <label><input type="radio" name="plan" value="free" checked> Free</label>
      <label><input type="radio" name="plan" value="pro"> Pro</label>
      <label><input type="radio" name="plan" value="team"> Team</label>
    </fieldset>
    <label for="country">Country</label>
    <select id="country" name="country"><option>Norway</option><option selected>Chile</option><option>Japan</option></select>
    <label for="note">Note</label><textarea id="note" name="note">hello</textarea>
    <label><input type="checkbox" name="remember" checked> Remember me</label>
    <input type="hidden" name="csrf" value="x">
    <input type="submit" value="Sign in">
    <button type="reset">Clear</button>
    <a href="/forgot">Forgot your password?</a>
  </form>
</main>
</body></html>
