[package]
name = "iyakki-ide-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The AI IDE's plain layout and panel files that name no shell context: the pane layout and its saved preferences, and the model router panel. They need the toolkit only. iyakki_apps::apps::{ide_layout, ide_router} re-export every item under the old path (alpha.10 Q5, D-S2-01)."

[dependencies]
iyakki-uikit = { path = "../iyakki-uikit" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
iyakki-uikit = { path = "../iyakki-uikit", features = ["testing"] }
