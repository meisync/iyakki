[package]
name = "iyakki-tile-calendar"
version.workspace = true
edition.workspace = true
license.workspace = true

# The CALENDAR tile (month calendar, a day's agenda, a clock with alarms). Rule (crates/iyakki-core/tests/dependency_ratchet.rs): depends on
# `iyakki-uikit` and `iyakki-tile-api` only, never on the agent; its tests run against a fake `CalendarSource`.

[dependencies]
iyakki-uikit = { path = "../iyakki-uikit" }
iyakki-tile-api = { path = "../iyakki-tile-api" }

[dev-dependencies]
iyakki-uikit = { path = "../iyakki-uikit", features = ["testing"] }
