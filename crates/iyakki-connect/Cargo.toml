[package]
name = "iyakki-connect"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Small connector program: pin a tenant's certificate, sign in (password or device key), show the desktop in the installed browser (serve), exchange files in one shared folder."

[lib]
name = "iyakki_connect"
path = "src/lib.rs"

[[bin]]
name = "iyakki-connect"
path = "src/main.rs"

[dependencies]
iyakki-link.workspace = true
iyakki-sec.workspace = true
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
libc = "0.2"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
