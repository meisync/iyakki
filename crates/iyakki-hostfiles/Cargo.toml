[package]
name = "iyakki-hostfiles"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host files in window mode: the rules for importing, mounting and exporting files of the host computer's home folder (the screen is the iyakki-tile-hostfiles dialog). iyakki-shared re-exports it as `hostfiles`."

[dependencies]
iyakki-sec = { workspace = true }
iyakki-filescope = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
