[package]
name = "iyakki-client-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The IYAKKI client engine, picture mode (docs/development/CLIENT-SPLIT-DESIGN.md step 4): speaks the client session protocol, decodes the tile stream into an RGBA framebuffer and turns input into messages. Builds natively for tests and for wasm32-unknown-unknown for the browser page. EXPERIMENTAL."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iyakki-core-api = { path = "../iyakki-core-api", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
miniz_oxide = "0.8"
# the fallback key for a browser without Ed25519 in WebCrypto (the same crate and settings as iyakki-link; the seed comes from the page)
ed25519-dalek = { version = "3", default-features = false, features = ["zeroize"] }

[dev-dependencies]
sha2 = "0.10"
iyakki-link.workspace = true
