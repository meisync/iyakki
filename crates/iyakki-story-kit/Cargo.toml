[package]
name = "iyakki-story-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TALES helpers that are not data: request messages, audio pieces (levels, assembling, splitting, the prebuilt synth, render), the HTML export. Base layer; iyakki_shared::story re-exports every item (alpha.10 Q3, D-P6-03)."

[dependencies]
iyakki-story-model = { workspace = true }
iyakki-voice-model = { workspace = true }
iyakki-chat-model = { workspace = true }
serde = { version = "1", features = ["derive"] }
iyakki-k8s-model = { workspace = true }
iyakki-provider-kind = { workspace = true }
iyakki-scene = { workspace = true }
iyakki-sec = { workspace = true }
iyakki-filescope = { workspace = true }
iyakki-schema = { workspace = true }
iyakki-piclog = { workspace = true }
serde_json = "1"
iyakki-sysinfo-model = { workspace = true }

[dev-dependencies]
