<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IYAKKI app preview</title><link rel="icon" href="data:,">
<style>
html,body{margin:0;background:#1b1f27;color:#e8e8e8;font-family:system-ui,sans-serif}
#wrap{position:relative;display:inline-block;margin:16px}
canvas{display:block;outline:none}
#aria{position:absolute;left:0;top:0}
#err{color:#ff8a80;margin:16px;white-space:pre-wrap}
</style></head>
<body>
<div id="wrap"><canvas id="c" tabindex="0" aria-label="App"></canvas><div id="aria"></div></div>
<div id="err" role="alert"></div>
<script src="/displaylist.js"></script>
<script>
const D = window.IyakkiDisplayList, c = document.getElementById("c");
const io = {
  frame: () => fetch("/frame").then((r) => r.text()),
  send: (lines) => fetch("/event", { method: "POST", headers: { "X-Iyakki-Preview": "1" }, body: lines.join("\n") + "\n" })
    .then((r) => r.text().then((t) => { if (!r.ok) throw new Error(t); return t; })),
};
const app = D.connect({ canvas: c, ariaHost: document.getElementById("aria"), io, scale: 1,
  onError: (m) => { document.getElementById("err").textContent = "The display list was refused: " + m; } });
window.app = app;
// `?engine=wasm`: the client engine module draws the list (shapes, text from the glyphs this page hands it, the accessibility tree) and
// makes the input lines (F-SDK-29); without it the JavaScript renderer does all of that
if (new URLSearchParams(location.search).get("engine") === "wasm") {
  document.title += " (engine)";
  (async () => {
    const { IyakkiEngine } = await import("/engine.js");
    const { mountDisplayList } = await import("/uidisplay.js");
    const engine = await IyakkiEngine.load(await (await fetch("/engine.wasm")).arrayBuffer());
    const errBox = document.getElementById("err");
    const ui = window.engineUi = mountDisplayList({ engine, canvas: c, ariaHost: document.getElementById("aria"), io, scale: 1, onError: (m) => { errBox.textContent = m; } });
    window.engineState = ui.state;
    addEventListener("keydown", ui.onKey);
    ui.show(await io.frame());
    window.engineReady = true;
  })();
} else {
  app.start().then(() => c.focus());
}
</script>
</body></html>
