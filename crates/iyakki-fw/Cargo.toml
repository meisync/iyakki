[package]
name = "iyakki-fw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The firewall: a policy model (default: block incoming), validation, a ruleset generator, an in-house nf_tables netlink writer, an apply/confirm/revert engine and the blocked-connection log."

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iyakki-schema.workspace = true
log.workspace = true
