[package]
name = "iyakki-hotspot"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wi-Fi hotspot (access point) core, in-house and hardware-free: WPA2-PSK key derivation and 4-way handshake (authenticator side), AES key wrap, DHCP server, DNS forwarder, subnet chooser, settings checks and nl80211 message builders."

[dependencies]
iyakki-sec.workspace = true
# F-HOTSPOT-22: P-256 point arithmetic and HMAC-SHA-256 for the WPA3-SAE exchange (in-house, ring and sha2 only)
iyakki-webcrypto = { path = "../iyakki-webcrypto" }
