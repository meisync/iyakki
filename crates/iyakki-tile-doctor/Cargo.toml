[package]
name = "iyakki-tile-doctor"
version.workspace = true
edition.workspace = true
license.workspace = true

# The DOCTOR tile (what is wrong with this computer). Rule (crates/iyakki-core/tests/dependency_ratchet.rs): depends on `iyakki-uikit` and
# `iyakki-tile-api` only, never on the agent or the shared crate; the shell hands it the machine through `DoctorPort` (a fake in tests).

[dependencies]
iyakki-uikit = { path = "../iyakki-uikit" }
iyakki-tile-api = { path = "../iyakki-tile-api" }

[dev-dependencies]
iyakki-uikit = { path = "../iyakki-uikit", features = ["testing"] }
