[package]
name = "iyakki-tile-tales"
version.workspace = true
edition.workspace = true
license.workspace = true

# The TALES tile (stories written, drawn and read aloud). Rule (crates/iyakki-core/tests/dependency_ratchet.rs): depends on `iyakki-uikit`,
# `iyakki-tile-api` and the pure leaf crates named in tests/data/tile_crate_deps.allow, never on the agent or the shared crate; its tests
# run against a fake `TalesPort`. The shell adapter is `crates/iyakki-apps/src/apps/story.rs`, the real port `story_port.rs`.

[features]
# Test seams the shell's own tests use (drawers, memory, helper hooks). Never on in a product build.
testing = []

[dependencies]
iyakki-uikit = { path = "../iyakki-uikit" }
iyakki-story-model = { workspace = true }
iyakki-story-kit = { workspace = true }
iyakki-voice-model = { workspace = true }
iyakki-chat-model = { workspace = true }
iyakki-scene = { workspace = true }
iyakki-piclog = { workspace = true }
iyakki-provider-kind = { workspace = true }
iyakki-chatview = { workspace = true }
iyakki-sysinfo-model = { workspace = true }
iyakki-web = { workspace = true }
tiny-skia = "0.11"
zeroize = "1"
serde_json = "1"

[dev-dependencies]
iyakki-uikit = { path = "../iyakki-uikit", features = ["testing"] }
iyakki-testkit = { path = "../iyakki-testkit" }
iyakki-sec = { workspace = true }
iyakki-filescope = { workspace = true }
