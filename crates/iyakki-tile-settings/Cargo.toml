[package]
name = "iyakki-tile-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Settings page as a WASM tile, first slice (F-WEB-56): a read-only overview of the account, the models, web access and tools. tile.wasm is the wasm32 build."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
iyakki-tile-kit = { path = "../iyakki-tile-kit" }
serde_json = "1"

[dev-dependencies]
iyakki-tile-host = { path = "../iyakki-tile-host" }
