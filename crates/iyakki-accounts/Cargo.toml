[package]
name = "iyakki-accounts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The local accounts and sign-in sessions (hashed passwords, roles, the user store file), split out of iyakki-shell so a service build need not link the desktop (F-WEBSVC-11)."

[dependencies]
iyakki-sec.workspace = true
thiserror.workspace = true
iyakki-schema.workspace = true
iyakki-ledger.workspace = true
argon2 = { version = "0.5", features = ["std", "rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
