[package]
name = "iyakki-swarm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iyakki-wasm.workspace = true
libp2p = { version = "0.57", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "mdns", "request-response", "cbor", "macros"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
thiserror.workspace = true
log.workspace = true
