[package]
name = "iyakki-tile-lab"
version.workspace = true
edition.workspace = true
license.workspace = true

# The LAB tile (pictures, vision and video frames). Rule (crates/iyakki-core/tests/dependency_ratchet.rs): depends on `iyakki-uikit` and on the pure
# model crate named in tests/data/tile_crate_deps.allow (`iyakki-lab-model`), never on the agent or the shared crate; its tests run against a fake
# `LabPort`. The shell adapter is `crates/iyakki-apps/src/apps/lab.rs`, the real port `lab_port.rs`.

[dependencies]
iyakki-uikit = { path = "../iyakki-uikit" }
iyakki-lab-model = { workspace = true }
iyakki-clock = { workspace = true }
tiny-skia = "0.11"

[dev-dependencies]
iyakki-testkit = { path = "../iyakki-testkit" }
iyakki-uikit = { path = "../iyakki-uikit", features = ["testing"] }
