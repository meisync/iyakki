[package]
name = "iyakki-tile-usage"
version.workspace = true
edition.workspace = true
license.workspace = true

# The USAGE tile (token usage as a stacked bar chart). Rule (crates/iyakki-core/tests/dependency_ratchet.rs): depends on
# `iyakki-uikit` and `iyakki-tile-api` only, never on the agent; its tests run against a fake `UsageSource`.

[dependencies]
iyakki-uikit = { path = "../iyakki-uikit" }
iyakki-tile-api = { path = "../iyakki-tile-api" }

[dev-dependencies]
iyakki-uikit = { path = "../iyakki-uikit", features = ["testing"] }
