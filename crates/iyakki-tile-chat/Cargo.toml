[package]
name = "iyakki-tile-chat"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The chat as a WASM tile, first slice (F-WEB-53): type a message, send it, read the run's lines. tile.wasm is the wasm32 build."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
iyakki-tile-kit = { path = "../iyakki-tile-kit" }
serde_json = "1"

[dev-dependencies]
iyakki-tile-host = { path = "../iyakki-tile-host" }
