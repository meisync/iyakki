[package]
name = "iyakki-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dev-dependencies]
iyakki-core-fake = { workspace = true }
iyakki-proxy = { path = "../iyakki-proxy", features = ["testcerts"] }

[dependencies]
log.workspace = true
iyakki-sec.workspace = true
iyakki-core-api.workspace = true
iyakki-edit.workspace = true
iyakki-vfs.workspace = true
iyakki-wasm.workspace = true
iyakki-mem.workspace = true
iyakki-ledger.workspace = true
iyakki-netscan.workspace = true
iyakki-proxy = { path = "../iyakki-proxy" }
iyakki-web.workspace = true
iyakki-pdf.workspace = true
iyakki-wake.workspace = true
iyakki-rtsp.workspace = true
# camera recordings: the AES-256-XTS and HMAC primitives of the data-volume crate (camrec_format.rs)
iyakki-volcrypt.workspace = true
iyakki-webview.workspace = true
iyakki-data.workspace = true
iyakki-drivers.workspace = true
iyakki-devctl.workspace = true
iyakki-hwinfo.workspace = true
# hot patches: the same id/layer rules as the first-stage init that mounts them (iyakki dev patch)
iyakki-stage1 = { path = "../iyakki-stage1" }
# update-pack reads the boot partition of an install image with the installer's own FAT reader
iyakki-usb = { path = "../iyakki-usb" }
# DISKS: the partition-table reader and writer (GPT), human sizes
iyakki-storage.workspace = true
iyakki-flow.workspace = true
# VPN profiles: importers, route and guard plans, WireGuard netlink messages (vpn_mgr.rs)
iyakki-vpn = { path = "../iyakki-vpn" }
# the guard and DNS-redirect tables go through the Firewall's own netlink writer (vpn_nft.rs); the images ship no nft
iyakki-fw.workspace = true
# the Wi-Fi hotspot core (pure); the real nl80211 and packet sockets are in nl80211_os.rs
iyakki-hotspot = { path = "../iyakki-hotspot" }
iyakki-schema.workspace = true
# the desktop connector's client, WebSocket framing and picture codec live in the small crate the connector program shares (re-exported here)
iyakki-link.workspace = true
iyakki-js.workspace = true
# WASM tiles served to a browser (webservice/tiles.rs): the sandbox host, the ABI types and the example tile
iyakki-tile-host = { path = "../iyakki-tile-host" }
iyakki-tile-abi = { path = "../iyakki-tile-abi" }
iyakki-tile-example = { path = "../iyakki-tile-example" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
chacha20poly1305 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
zeroize = "1"
sha2 = "0.10"
miniz_oxide = "0.8"
# the picture codec (pixelcodec.rs, shared with iyakki-remote) codes and reads PNG tiles with the same crate as the web front end
tiny-skia = "0.11"
ruzstd = "0.9"
nanomp3 = { version = "0.2", default-features = false, features = ["std"] }
ed25519-dalek = "3"
# member key pairs for the shared vaults (cloudkeys.rs): X25519 only, no random-number feature (the bytes come from the system)
x25519-dalek = { version = "3", default-features = false, features = ["zeroize"] }
# SSH keys protected by a passphrase (aes256-ctr, see sshkey.rs)
aes = "0.8"
ctr = "0.9"
# developer mode's client (`devmode::client`): the same TLS library and features as the web front end (iyakki-remote)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
libc = "0.2"
# the web service makes its own self-signed certificate (same crate and features as iyakki-remote)
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
