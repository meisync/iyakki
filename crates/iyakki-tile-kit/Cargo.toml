[package]
name = "iyakki-tile-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What the WASM page tiles share: a palette, text clipping, buttons, a JSON call helper and the six exports of tile ABI 1 for a tile written in Rust (F-WEB-53, F-WEB-54, F-WEB-56)."

[features]
# A tile that handles `Event::App` (the core's app events, F-SDK-202) reports ABI 3 instead of 1; the host then sends it the events it listens for.
app-events = []

[dependencies]
iyakki-tile-abi = { path = "../iyakki-tile-abi" }
serde_json = "1"
