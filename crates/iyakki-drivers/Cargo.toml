[package]
name = "iyakki-drivers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Driver packs: hardware matching, firmware placement on the data volume, modprobe snippets, kernel-module checks (vermagic) and the camera firmware extraction. Never compiles anything."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
miniz_oxide = "0.8"
libc = "0.2"
iyakki-hwinfo.workspace = true
