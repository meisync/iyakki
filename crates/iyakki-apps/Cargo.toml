iyakki-dash.workspace = true
iyakki-agent-api.workspace = true
zeroize = "1"
iyakki-filescope.workspace = true
iyakki-proxy = { path = "../iyakki-proxy" }
iyakki-diskcrypt.workspace = true
iyakki-sshfs.workspace = true
iyakki-wordtime.workspace = true
iyakki-enchome.workspace = true
iyakki-battery.workspace = true
iyakki-qr.workspace = true
iyakki-core-api = { workspace = true }
iyakki-core-local = { workspace = true }
iyakki-vt = { path = "../iyakki-vt" }
iyakki-uikit = { path = "../iyakki-uikit" }
iyakki-tile-api = { path = "../iyakki-tile-api" }
