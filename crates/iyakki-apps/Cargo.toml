[package]
name = "iyakki-apps"
version.workspace = true
edition.workspace = true
license.workspace = true

[dev-dependencies]
iyakki-testkit = { path = "../iyakki-testkit" }
iyakki-agent = { path = "../iyakki-agent" }
iyakki-core-fake = { workspace = true }
iyakki-uikit = { path = "../iyakki-uikit", features = ["testing"] }
iyakki-chatview = { workspace = true, features = ["testing"] }
iyakki-tile-dash = { path = "../iyakki-tile-dash", features = ["testing"] }
iyakki-tile-flows = { path = "../iyakki-tile-flows", features = ["testing"] }
iyakki-tile-git = { path = "../iyakki-tile-git", features = ["testing"] }
iyakki-proxy = { path = "../iyakki-proxy", features = ["testcerts"] }
iyakki-rtsp = { path = "../iyakki-rtsp" }

[features]
# Test seams the shell's own tests use (the `tests` helper modules, test-only trait methods). Never on in a product build.
testing = ["dep:iyakki-core-fake", "iyakki-uikit/testing", "iyakki-tile-dash/testing", "iyakki-tile-k8s/testing", "iyakki-tile-devtools/testing", "iyakki-tile-flows/testing", "iyakki-tile-git/testing", "iyakki-tile-tales/testing", "iyakki-tile-voice/testing"]

