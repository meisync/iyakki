[package]
name = "iyakki-apps"
version.workspace = true
edition.workspace = true
license.workspace = true

[dev-dependencies]
iyakki-agent = { path = "../iyakki-agent" }
iyakki-core-fake = { workspace = true }
iyakki-uikit = { path = "../iyakki-uikit", features = ["testing"] }
iyakki-proxy = { path = "../iyakki-proxy", features = ["testcerts"] }
iyakki-rtsp = { path = "../iyakki-rtsp" }

[features]
# Test seams the shell's own tests use (the `tests` helper modules, test-only trait methods). Never on in a product build.
testing = ["dep:iyakki-core-fake", "iyakki-uikit/testing"]

[dependencies]
iyakki-clock.workspace = true
iyakki-camdetect.workspace = true
iyakki-cloudmode.workspace = true
