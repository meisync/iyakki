[package]
name = "iyakki-dash"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The dashboard engine (model, frame, expressions, connectors, stores, sharing rules), split out of iyakki-agent for F-SPLIT-03. No Services, no vault: the agent adds the chat tools and the host adapters."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
iyakki-sec.workspace = true
iyakki-schema.workspace = true
iyakki-proxy = { path = "../iyakki-proxy" }
iyakki-shared.workspace = true
iyakki-clock.workspace = true

[dev-dependencies]
iyakki-proxy = { path = "../iyakki-proxy", features = ["testcerts"] }

[features]
# the fake upstream, resolver and runner of the connector tests, for the agent's tests of the assistant's dashboard tools
testing = []
