[package]
name = "iyakki-tile-radio"
version.workspace = true
edition.workspace = true
license.workspace = true

# The RADIO tile (internet radio: stations, languages, search, the speaker question, trusted certificates). Rule
# (crates/iyakki-core/tests/dependency_ratchet.rs): depends on `iyakki-uikit` and `iyakki-tile-api` only, never on the agent; its tests run against a
# fake `RadioPort`. The shell adapter is `crates/iyakki-apps/src/apps/radio.rs`.

[dependencies]
iyakki-uikit = { path = "../iyakki-uikit" }
iyakki-tile-api = { path = "../iyakki-tile-api" }

[dev-dependencies]
iyakki-uikit = { path = "../iyakki-uikit", features = ["testing"] }
