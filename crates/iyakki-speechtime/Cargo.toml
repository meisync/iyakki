[package]
name = "iyakki-speechtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Word times of one piece of reading aloud (where each word starts, where the times come from) as a leaf crate; iyakki_shared::speechtime re-exports it. Shared by the TALES model and the LAB tile."

[dependencies]
iyakki-wordtime = { workspace = true }
iyakki-sec = { workspace = true }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
