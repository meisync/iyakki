# musl gives threads created by C code a 128 KiB stack; glibc-based Linux gives 8 MiB. Raise musl's default to
# the Linux norm (musl reads the stack size from the program header; it caps it at 8 MiB).
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-Wl,-z,stack-size=8388608"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-Wl,-z,stack-size=8388608"]

# Test threads get a big stack: the JavaScript sandbox (iyakki-js) runs WebAssembly on the calling thread's stack.
[env]
RUST_MIN_STACK = "33554432"
