set default="0"
set timeout="3"

# ---- the first thing on the screen: the IYAKKI logo --------------------------------------------------------------------
# GRUB draws in graphics mode (gfxterm) over the logo picture, keeps the screen mode for the kernel (gfxpayload=keep, so the
# EFI screen does not change before IYAKKI's own boot screen), and falls back to plain text if anything here is missing
# (no font file, no video module, no picture): the menu below always works. `iyakki_text=1` could be set to skip all of it.
set gfxmode=auto
set gfxpayload=keep
set iyakki_gfx=0
insmod all_video
insmod gfxterm
insmod png
insmod gfxmenu
insmod gfxterm_background
insmod test
if [ -z "$iyakki_text" ]; then
	if loadfont $prefix/fonts/unicode.pf2; then
		# the bigger font for the menu itself (made by post-image.sh from DejaVu Sans Bold when grub-mkfont is there; the theme names it only then)
		loadfont $prefix/fonts/iyakki-menu.pf2
		loadfont $prefix/fonts/iyakki-term.pf2
		if terminal_output gfxterm; then
			set iyakki_gfx=1
			if [ -f $prefix/themes/iyakki/theme.txt ]; then
				set theme=$prefix/themes/iyakki/theme.txt
				# the terminal window GRUB paints while it loads the kernel: the desktop colour, not a black box
				background_color "#050710"
			elif [ -f $prefix/themes/iyakki/iyakki-bg.png ]; then
				background_image $prefix/themes/iyakki/iyakki-bg.png
			fi
		fi
	fi
fi
# Compatible USB mode (Settings -> Storage): when the switch is on, IYAKKI wrote this file on the boot partition and it sets
# `iyakki_usbq` to `usb-storage.quirks=<vendor>:<product>:u` for the boot drive (no UAS: slower, steadier). Without the file the
# variable is empty and every entry below boots exactly as before. docs/STORAGE-LOSS.md.
set iyakki_usbq=""
if [ -f $prefix/iyakki-usb-compat.cfg ]; then
	source $prefix/iyakki-usb-compat.cfg
fi
# the submenu ("More options...") only sees exported variables: without this its entries read an empty RAM disk path ("error: filename expected")
export iyakki_usbq
set color_normal=light-gray/black
set color_highlight=cyan/black

# GRUB cannot animate while it reads the kernel and the initramfs (on a Mac's firmware USB driver this takes 10 to 30 seconds), so
# each entry says in plain words what is going on, in the terminal window under the logo (theme.txt keeps the logo clear of it).
function iyakki_loading {
	echo ""
	echo "  IYAKKI is starting"
	echo "  ------------------------------------------------------------"
	echo "  [1/3] Reading the kernel...         (the stick's light blinks: that is normal)"
}

# Printed between the two reads: the system image is the big file (about 220 MB with the full start; the fast start reads about 1 MB). Firmware with
# a slow USB driver can need minutes for the full one, and GRUB shows nothing while it reads, so these lines tell a slow read from a stop: if
# "[2/3]" is the last line, the read has not finished (watch the stick's light). The fast start's entries pass "fast".
function iyakki_image_next {
	echo "  [1/3] Kernel read                    done"
	if [ "$1" = fast ]; then
		echo "  [2/3] Reading the small start file   (fast start, a few seconds)"
	else
		echo "  [2/3] Reading the system image       (the long step: up to a few minutes on a Mac's USB port)"
		echo "        Tip: the plain \"IYAKKI\" entry reads about 1 MB instead when the fast start is on this stick."
	fi
}
function iyakki_image_done {
	echo "  [2/3] Read                           done"
	echo "  [3/3] Starting the kernel...         the IYAKKI animation follows; the screen stays on this logo until then"
}

# BEGIN lean-boot (this block is managed by dist/buildroot/lean-install.sh and lean-sync.py; the markers are how they find the block again)
# The fast start (docs/BOOT-SPEED.md): a ~1 MB first-stage RAM disk instead of the 300 MB one; the system itself is read from the stick after the
# kernel started (boot/root.sfs, or a tree on the data volume). Every entry below reads $iyakki_initrd: the small RAM disk when
# boot/initrd-lean is on the volume, the full one otherwise (the live ISO, a stick without the fast start). If a fast start ever fails, the first stage writes
# boot/grub/iyakki-lean-failed and every entry reads the full RAM disk again when the volume has one (so a damaged root cannot make the machine restart in a loop); a fast start
# that works removes the file again. "IYAKKI - full start" under More options always reads the full one.
insmod test
set iyakki_initrd=__INITRD_PATH__
set iyakki_fast=""
if [ -f __INITRD_PATH__-lean ]; then
	set iyakki_initrd=__INITRD_PATH__-lean
	set iyakki_fast=fast
	# a failed fast start: the full RAM disk is read instead, when this volume still has it (a stick made without it has only the fast start)
	if [ -f $prefix/iyakki-lean-failed ]; then
		if [ -f __INITRD_PATH__ ]; then
			set iyakki_initrd=__INITRD_PATH__
			set iyakki_fast=""
		fi
	fi
fi
export iyakki_initrd
export iyakki_fast
# END lean-boot

# Normal start: the boot screen (logo, progress) replaces the kernel's text. `quiet` keeps the kernel from
# printing to the screen; everything is still in the log (press L on the boot screen, or run dmesg).
# Every entry with `quiet` also has `loglevel=3 vt.global_cursor_default=0` (no text, no blinking cursor before the boot
# screen). Options looked at and deliberately NOT used with this kernel (6.12, see docs/MAC-HARDWARE.md, Mac mini 2018):
#   i915.fastboot=1  the parameter no longer exists (i915 always tries to keep the firmware's mode; the kernel only logs
#                    "unknown parameter 'fastboot' ignored")
#   consoleblank=0   already the kernel's default        logo.nologo     the kernel has no boot logo (CONFIG_LOGO is off)
#   fbcon=nodefer    only acts with deferred console takeover, which this kernel does not have
#   video=efifb:keep the firmware screen is driven by simpledrm, not efifb
# The "safe graphics" entry below is the fallback when a GPU driver's mode change loses the picture.
menuentry "IYAKKI" {
	iyakki_loading
	linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 initcall_blacklist=hpet_init,crb_acpi_driver_init
	iyakki_image_next $iyakki_fast
	initrd $iyakki_initrd
	iyakki_image_done
}

# The rarely needed starts live in one submenu so the first screen stays short (Up/Down, Enter; Esc comes back).
submenu "More options..." {
	# The new boot loader (iyakki-boot, docs/BOOT-LOADER.md): a test entry, GRUB stays the default way in. UEFI only, and only when the
	# image carries the loader (dist/buildroot/boot-loader-stage.sh put /EFI/iyakki-boot/loader.efi on this boot volume), so on a BIOS
	# start, from the live ISO or on a build without the loader the entry is not shown. Under Secure Boot the loader must be signed with
	# the image's key; an unsigned one is refused by the firmware and GRUB comes back to this menu.
	# (A loader-default image, IYAKKI_LOADER_DEFAULT=1, drops this block: there the loader starts first and this GRUB is only its Recovery
	# row, dist/buildroot/loader-default.sh.)
	# BEGIN loader-test-entry
	if [ "$grub_platform" = efi ]; then
		if [ -f /EFI/iyakki-boot/loader.efi ]; then
			menuentry "IYAKKI - new boot loader (test)" {
				chainloader /EFI/iyakki-boot/loader.efi
			}
		fi
	fi
	# END loader-test-entry

	# Install mode: boots the live system and runs the installer on the console instead of the desktop (iyakki.install=1, PID 1 starts
	# `iyakki-usb`'s pages). Choose a disk's free space or partitions, see the plan, confirm with the Install button. The stick it
	# started from is never offered as a target. docs/INSTALLER.md.
	menuentry "IYAKKI - Install to a disk" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 iyakki.install=1 initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	# Safe graphics: keep the firmware's screen as it is (no GPU driver, so no mode change at all). `nomodeset` stops GPU drivers
	# that are built in; the blacklist stops the ones loaded as modules.
	menuentry "IYAKKI - safe graphics (simple framebuffer, no GPU drivers)" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 nomodeset modprobe.blacklist=i915,xe,amdgpu,radeon,nouveau initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	# Experiments for the black second when the GPU driver takes over from the firmware's screen (docs/BOOT-SPEED.md, "The screen goes off for a second"):
	# This entry keeps the simple framebuffer out of the way so the GPU driver is the only one (Linux 6.12 has no i915.fastboot switch: it is always on).
	# It starts the normal system; compare how the screen behaves between the logo and the form with the plain "IYAKKI" entry.
	menuentry "IYAKKI - screen test (no simple framebuffer)" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 initcall_blacklist=hpet_init,crb_acpi_driver_init,simpledrm_platform_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	# The full start: the whole system in the RAM disk, read by GRUB before the kernel starts (slow on a Mac's USB port). For when the fast start does not work.
	if [ -f __INITRD_PATH__ ]; then
		menuentry "IYAKKI - full start (slower; if the fast start does not work)" {
			iyakki_loading
			linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 initcall_blacklist=hpet_init,crb_acpi_driver_init
			iyakki_image_next
			initrd __INITRD_PATH__
			iyakki_image_done
		}
	fi

	menuentry "IYAKKI - remote diagnostics (SSH, keys only)" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 iyakki.ssh=1 initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	# For a USB SSD that drops off the bus under UAS (seen once with a Samsung T7, vendor:product 04e8:4001, on a USB-C Mac): the
	# kernel's usb-storage driver is used instead of UAS for that one id. Slower (no command queueing), but a simpler, steadier path.
	# Other drives: Settings -> Storage -> Compatible USB mode writes the same quirk for the drive IYAKKI is running from.
	menuentry "IYAKKI - compatible USB mode (no UAS)" {
		iyakki_loading
		linux __KERNEL_PATH__ console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 usb-storage.quirks=04e8:4001:u initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	# Start-up trouble on a computer where the screen stays on the logo and the kernel prints nothing (seen on an HP 16-af0075c1, Core Ultra).
	# Each entry shows every kernel message from the first moment and changes ONE thing, so the entry that gets further tells which one it is.
	# Cfg only: no kernel option here is built into the kernel; they are the kernel's own documented boot parameters.
	menuentry "IYAKKI - trouble 1: early messages on the firmware screen" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 ignore_loglevel loglevel=8 earlycon=efifb keep_bootcon initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	menuentry "IYAKKI - trouble 2: messages + PCI and power-saving off" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 ignore_loglevel loglevel=8 earlycon=efifb keep_bootcon pci=realloc,nocrs pcie_aspm=off intel_idle.max_cstate=1 initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	menuentry "IYAKKI - trouble 3: messages + one CPU, no APIC timer tricks" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 ignore_loglevel loglevel=8 earlycon=efifb keep_bootcon nosmp noapic nolapic_timer initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	menuentry "IYAKKI - trouble 4: messages + ACPI limited" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 ignore_loglevel loglevel=8 earlycon=efifb keep_bootcon acpi=noirq pci=nomsi initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	menuentry "IYAKKI - trouble 5: safe graphics, everything on the screen" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=ttyS0,115200 console=tty0 panic=0 ignore_loglevel loglevel=8 nomodeset modprobe.blacklist=i915,xe,amdgpu,radeon,nouveau initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	menuentry "IYAKKI - show boot messages" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	menuentry "IYAKKI - hardware check (keyboard, mouse, touch, display)" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 iyakki.hwcheck=1 initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	menuentry "IYAKKI (verbose, boot self-test, power off)" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 iyakki.selftest=1 initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	# NVIDIA's own driver (Store -> Setup -> NVIDIA GPU driver, docs/GPU-K3S.md) cannot take a card nouveau already drives, and nouveau holds the
	# screen: start without nouveau (the firmware's framebuffer carries the screen, as in the safe graphics entry, but the other GPU drivers load).
	menuentry "IYAKKI - NVIDIA driver (nouveau off)" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=nouveau initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	menuentry "IYAKKI - also in a browser (HTTPS on port 8443)" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 iyakki.web=1 initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	menuentry "IYAKKI - touch screen: probe the connected monitor at start" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 iyakki.touchscreen=probe initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	menuentry "IYAKKI - touch screen test: i915 without DP-MST" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 i915.enable_dp_mst=0 initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	menuentry "IYAKKI - touch screen test: i915 without power saving" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 i915.enable_psr=0 i915.enable_fbc=0 i915.enable_dc=0 initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	menuentry "IYAKKI - touch screen test: i915 all four switches" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 i915.enable_dp_mst=0 i915.enable_psr=0 i915.enable_fbc=0 i915.enable_dc=0 initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	menuentry "IYAKKI - touch screen test: no boot screen" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 iyakki.bootscreen=off initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	menuentry "IYAKKI - touch screen test: boot screen leaves the display open" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 iyakki.fbset=skip initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}

	menuentry "IYAKKI - touch screen: full probe, the connected monitor too (screen may blink)" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 iyakki.touchscreen=full initcall_blacklist=hpet_init,crb_acpi_driver_init
		iyakki_image_next $iyakki_fast
		initrd $iyakki_initrd
		iyakki_image_done
	}
}
