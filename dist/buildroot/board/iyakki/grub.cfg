set default="0"
set timeout="3"

# ---- the first thing on the screen: the IYAKKI logo --------------------------------------------------------------------
# GRUB draws in graphics mode (gfxterm) over the logo picture, keeps the screen mode for the kernel (gfxpayload=keep, so the
# EFI screen does not change before IYAKKI's own boot screen), and falls back to plain text if anything here is missing
# (no font file, no video module, no picture): the menu below always works. `iyakki_text=1` could be set to skip all of it.
set gfxmode=auto
set gfxpayload=keep
set iyakki_gfx=0
insmod all_video
insmod gfxterm
insmod png
insmod gfxmenu
insmod gfxterm_background
insmod test
if [ -z "$iyakki_text" ]; then
	if loadfont $prefix/fonts/unicode.pf2; then
		if terminal_output gfxterm; then
			set iyakki_gfx=1
			if [ -f $prefix/themes/iyakki/theme.txt ]; then
				set theme=$prefix/themes/iyakki/theme.txt
				# the terminal window GRUB paints while it loads the kernel: the desktop colour, not a black box
				background_color "#050710"
			elif [ -f $prefix/themes/iyakki/iyakki-bg.png ]; then
				background_image $prefix/themes/iyakki/iyakki-bg.png
			fi
		fi
	fi
fi
set color_normal=light-gray/black
set color_highlight=cyan/black

# GRUB cannot animate while it reads the kernel and the initramfs (on a Mac's firmware USB driver this takes 10 to 30 seconds), so
# each entry says in plain words what is going on, in the terminal window under the logo (theme.txt keeps the logo clear of it).
function iyakki_loading {
	echo ""
	echo "  Loading IYAKKI from USB. Please wait 30 seconds to 1 minute."
	echo "  The screen stays on this logo until the boot animation starts."
}

# Normal start: the boot screen (logo, progress) replaces the kernel's text. `quiet` keeps the kernel from
# printing to the screen; everything is still in the log (press L on the boot screen, or run dmesg).
# Every entry with `quiet` also has `loglevel=3 vt.global_cursor_default=0` (no text, no blinking cursor before the boot
# screen). Options looked at and deliberately NOT used with this kernel (6.12, see docs/MAC-HARDWARE.md, Mac mini 2018):
#   i915.fastboot=1  the parameter no longer exists (i915 always tries to keep the firmware's mode; the kernel only logs
#                    "unknown parameter 'fastboot' ignored")
#   consoleblank=0   already the kernel's default        logo.nologo     the kernel has no boot logo (CONFIG_LOGO is off)
#   fbcon=nodefer    only acts with deferred console takeover, which this kernel does not have
#   video=efifb:keep the firmware screen is driven by simpledrm, not efifb
# The "safe graphics" entry below is the fallback when a GPU driver's mode change loses the picture.
menuentry "IYAKKI" {
	iyakki_loading
	linux __KERNEL_PATH__ console=tty0 console=ttyS0,115200 quiet loglevel=3 vt.global_cursor_default=0
	initrd __INITRD_PATH__
}

menuentry "IYAKKI - show boot messages" {
	iyakki_loading
	linux __KERNEL_PATH__ console=tty0 console=ttyS0,115200
	initrd __INITRD_PATH__
}

menuentry "IYAKKI - hardware check (keyboard, mouse, touch, display)" {
	iyakki_loading
	linux __KERNEL_PATH__ console=tty0 console=ttyS0,115200 quiet loglevel=3 vt.global_cursor_default=0 iyakki.hwcheck=1
	initrd __INITRD_PATH__
}

# Safe graphics: keep the firmware's screen as it is (no GPU driver, so no mode change at all). `nomodeset` stops GPU drivers
# that are built in; the blacklist stops the ones loaded as modules.
menuentry "IYAKKI - safe graphics (simple framebuffer, no GPU drivers)" {
	iyakki_loading
	linux __KERNEL_PATH__ console=tty0 console=ttyS0,115200 quiet loglevel=3 vt.global_cursor_default=0 nomodeset modprobe.blacklist=i915,xe,amdgpu,radeon,nouveau
	initrd __INITRD_PATH__
}

menuentry "IYAKKI (verbose, boot self-test, power off)" {
	iyakki_loading
	linux __KERNEL_PATH__ console=tty0 console=ttyS0,115200 iyakki.selftest=1
	initrd __INITRD_PATH__
}

menuentry "IYAKKI - remote diagnostics (SSH, keys only)" {
	iyakki_loading
	linux __KERNEL_PATH__ console=tty0 console=ttyS0,115200 quiet loglevel=3 vt.global_cursor_default=0 iyakki.ssh=1
	initrd __INITRD_PATH__
}

menuentry "IYAKKI - also in a browser (HTTPS on port 8443)" {
	iyakki_loading
	linux __KERNEL_PATH__ console=tty0 console=ttyS0,115200 quiet loglevel=3 vt.global_cursor_default=0 iyakki.web=1
	initrd __INITRD_PATH__
}
