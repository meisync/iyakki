set default="0"
set timeout="3"

# ---- the first thing on the screen: the IYAKKI logo --------------------------------------------------------------------
# GRUB draws in graphics mode (gfxterm) over the logo picture, keeps the screen mode for the kernel (gfxpayload=keep, so the
# EFI screen does not change before IYAKKI's own boot screen), and falls back to plain text if anything here is missing
# (no font file, no video module, no picture): the menu below always works. `iyakki_text=1` could be set to skip all of it.
set gfxmode=auto
set gfxpayload=keep
set iyakki_gfx=0
insmod all_video
insmod gfxterm
insmod png
insmod gfxmenu
insmod gfxterm_background
insmod test
if [ -z "$iyakki_text" ]; then
	if loadfont $prefix/fonts/unicode.pf2; then
		# the bigger font for the menu itself (made by post-image.sh from DejaVu Sans Bold when grub-mkfont is there; the theme names it only then)
		loadfont $prefix/fonts/iyakki-menu.pf2
		loadfont $prefix/fonts/iyakki-term.pf2
		if terminal_output gfxterm; then
			set iyakki_gfx=1
			if [ -f $prefix/themes/iyakki/theme.txt ]; then
				set theme=$prefix/themes/iyakki/theme.txt
				# the terminal window GRUB paints while it loads the kernel: the desktop colour, not a black box
				background_color "#050710"
			elif [ -f $prefix/themes/iyakki/iyakki-bg.png ]; then
				background_image $prefix/themes/iyakki/iyakki-bg.png
			fi
		fi
	fi
fi
# Compatible USB mode (Settings -> Storage): when the switch is on, IYAKKI wrote this file on the boot partition and it sets
# `iyakki_usbq` to `usb-storage.quirks=<vendor>:<product>:u` for the boot drive (no UAS: slower, steadier). Without the file the
# variable is empty and every entry below boots exactly as before. docs/STORAGE-LOSS.md.
set iyakki_usbq=""
if [ -f $prefix/iyakki-usb-compat.cfg ]; then
	source $prefix/iyakki-usb-compat.cfg
fi
set color_normal=light-gray/black
set color_highlight=cyan/black

# GRUB cannot animate while it reads the kernel and the initramfs (on a Mac's firmware USB driver this takes 10 to 30 seconds), so
# each entry says in plain words what is going on, in the terminal window under the logo (theme.txt keeps the logo clear of it).
function iyakki_loading {
	echo ""
	echo "  Loading IYAKKI... (this takes a few seconds; from a USB stick on a Mac up to 30 seconds)"
	echo "  The screen stays on this logo until the boot animation starts."
}

# BEGIN lean-boot (this block is managed by dist/buildroot/lean-install.sh and lean-sync.py; the markers are how they find the block again)
# The fast start (docs/BOOT-SPEED.md): a ~1 MB first-stage RAM disk instead of the 228 MB one; the system is read from the stick's data
# volume (iyakki/root/current). Shown ONLY when `dist/buildroot/lean-install.sh` put boot/initrd-lean on this volume, so a stick without it
# has the same menu as always. When it is there it comes first and is the default. If a fast start ever fails, the first stage writes
# boot/grub/iyakki-lean-failed and the default goes back to the full boot below (so a damaged tree cannot make the machine restart in a
# loop); a fast start that works removes the file again. The first entry still starts it by hand, whatever the file says.
# The command lines are the normal entry's and the remote diagnostics entry's, with the lean RAM disk.
insmod test
if [ -f __INITRD_PATH__-lean ]; then
	if [ -f $prefix/iyakki-lean-failed ]; then
		set default="IYAKKI"
	fi
	menuentry "IYAKKI - fast start (lean boot)" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0
		initrd __INITRD_PATH__-lean
	}
	menuentry "IYAKKI - fast start + remote diagnostics (SSH, keys only)" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 iyakki.ssh=1
		initrd __INITRD_PATH__-lean
	}
fi
# END lean-boot

# Normal start: the boot screen (logo, progress) replaces the kernel's text. `quiet` keeps the kernel from
# printing to the screen; everything is still in the log (press L on the boot screen, or run dmesg).
# Every entry with `quiet` also has `loglevel=3 vt.global_cursor_default=0` (no text, no blinking cursor before the boot
# screen). Options looked at and deliberately NOT used with this kernel (6.12, see docs/MAC-HARDWARE.md, Mac mini 2018):
#   i915.fastboot=1  the parameter no longer exists (i915 always tries to keep the firmware's mode; the kernel only logs
#                    "unknown parameter 'fastboot' ignored")
#   consoleblank=0   already the kernel's default        logo.nologo     the kernel has no boot logo (CONFIG_LOGO is off)
#   fbcon=nodefer    only acts with deferred console takeover, which this kernel does not have
#   video=efifb:keep the firmware screen is driven by simpledrm, not efifb
# The "safe graphics" entry below is the fallback when a GPU driver's mode change loses the picture.
menuentry "IYAKKI" {
	iyakki_loading
	linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0
	initrd __INITRD_PATH__
}

# Safe graphics: keep the firmware's screen as it is (no GPU driver, so no mode change at all). `nomodeset` stops GPU drivers
# that are built in; the blacklist stops the ones loaded as modules.
menuentry "IYAKKI - safe graphics (simple framebuffer, no GPU drivers)" {
	iyakki_loading
	linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 nomodeset modprobe.blacklist=i915,xe,amdgpu,radeon,nouveau
	initrd __INITRD_PATH__
}

# Install mode: boots the live system and runs the installer on the console instead of the desktop (iyakki.install=1, PID 1 starts
# `iyakki-usb`'s pages). Choose a disk's free space or partitions, see the plan, confirm with the Install button. The stick it
# started from is never offered as a target. docs/INSTALLER.md.
menuentry "IYAKKI - Install to a disk" {
	iyakki_loading
	linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 iyakki.install=1
	initrd __INITRD_PATH__
}

# The rarely needed starts live in one submenu so the first screen stays short (Up/Down, Enter; Esc comes back).
submenu "More options..." {
	menuentry "IYAKKI - remote diagnostics (SSH, keys only)" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 iyakki.ssh=1
		initrd __INITRD_PATH__
	}

	# For a USB SSD that drops off the bus under UAS (seen once with a Samsung T7, vendor:product 04e8:4001, on a USB-C Mac): the
	# kernel's usb-storage driver is used instead of UAS for that one id. Slower (no command queueing), but a simpler, steadier path.
	# Other drives: Settings -> Storage -> Compatible USB mode writes the same quirk for the drive IYAKKI is running from.
	menuentry "IYAKKI - compatible USB mode (no UAS)" {
		iyakki_loading
		linux __KERNEL_PATH__ console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 usb-storage.quirks=04e8:4001:u
		initrd __INITRD_PATH__
	}

	menuentry "IYAKKI - show boot messages" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20
		initrd __INITRD_PATH__
	}

	menuentry "IYAKKI - hardware check (keyboard, mouse, touch, display)" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 iyakki.hwcheck=1
		initrd __INITRD_PATH__
	}

	menuentry "IYAKKI (verbose, boot self-test, power off)" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 iyakki.selftest=1
		initrd __INITRD_PATH__
	}

	# NVIDIA's own driver (Store -> Setup -> NVIDIA GPU driver, docs/GPU-K3S.md) cannot take a card nouveau already drives, and nouveau holds the
	# screen: start without nouveau (the firmware's framebuffer carries the screen, as in the safe graphics entry, but the other GPU drivers load).
	menuentry "IYAKKI - NVIDIA driver (nouveau off)" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=nouveau
		initrd __INITRD_PATH__
	}

	menuentry "IYAKKI - also in a browser (HTTPS on port 8443)" {
		iyakki_loading
		linux __KERNEL_PATH__ $iyakki_usbq console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 iyakki.web=1
		initrd __INITRD_PATH__
	}

	# the fast start with the T7's USB id on the plain usb-storage driver (no UAS), as the "compatible USB mode" entry does for the full boot
	if [ -f __INITRD_PATH__-lean ]; then
		menuentry "IYAKKI - fast start, compatible USB mode (no UAS)" {
			iyakki_loading
			linux __KERNEL_PATH__ console=tty0 console=ttyS0,115200 panic=20 quiet loglevel=3 vt.global_cursor_default=0 usb-storage.quirks=04e8:4001:u
			initrd __INITRD_PATH__-lean
		}
	fi
}
