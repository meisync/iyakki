# Release image profile (IYAKKI_IMAGE_PROFILE=release, written by board/iyakki/post-build.sh): the image carries no vendor GPU firmware,
# so a GPU driver that needs it must not take the screen over. See /usr/libexec/iyakki/gpu-fw-guard and
# docs/development/RELEASE-IMAGE-PROFILE.md. Every other driver loads as usual.
install amdgpu /usr/libexec/iyakki/gpu-fw-guard amdgpu
install radeon /usr/libexec/iyakki/gpu-fw-guard radeon
install nouveau /usr/libexec/iyakki/gpu-fw-guard nouveau
install i915 /usr/libexec/iyakki/gpu-fw-guard i915
install xe /usr/libexec/iyakki/gpu-fw-guard xe
