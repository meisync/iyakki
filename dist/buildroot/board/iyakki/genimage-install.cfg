# The IYAKKI "install template": a small disk image with the layout a legacy BIOS PC expects.
#   sector 0        MBR with GRUB's boot code and the partition table
#   sectors 1-2047  GRUB core image (the gap before the first partition)
#   partition 1     FAT32 "IYAKKI-BOOT", active, type EFI: GRUB for UEFI, the config, kernel and initramfs as plain files
#   partition 2     IYAKKI data (type 0x83): only a marker here; `iyakki-usb` stretches it to fill the stick and IYAKKI
#                   formats it as the IYAKKI-DATA ext4 volume on first boot
image iyakki-boot.vfat {
	vfat {
		label = "IYAKKI-BOOT"
		extraargs = "-F 32"
		file EFI {
			image = "install-root/EFI"
		}
		file boot {
			image = "install-root/boot"
		}
	}
	size = 256M
}

image iyakki-install-x86_64.img {
	hdimage {
		disk-signature = 0x41465300
	}

	partition mbr-boot {
		in-partition-table = "no"
		image = "boot.img"
		offset = 0
		size = 512
		holes = {"(440; 512)"}
	}

	partition grub-core {
		in-partition-table = "no"
		image = "grub.img"
		offset = 512
	}

	partition boot {
		partition-type = 0xEF
		bootable = true
		image = "iyakki-boot.vfat"
		offset = 1M
	}

	partition data {
		partition-type = 0x83
		image = "data-marker.img"
	}
}
