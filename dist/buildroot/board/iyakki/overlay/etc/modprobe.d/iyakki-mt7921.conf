# MediaTek MT7921/MT7922 Wi-Fi cards: the newer firmware files of linux-firmware carry a regulatory block (CLC) in a layout the 6.12 driver
# rejects ("Invalid CLC record", then "hardware init failed" and no Wi-Fi interface). The driver can be told to skip that block; the card then
# runs under the regulatory domain of the wireless regulatory database. Seen on a Lenovo Legion Pro 5 16ARX8 (MT7922, PCI 14c3:0616).
options mt7921_common disable_clc=1
