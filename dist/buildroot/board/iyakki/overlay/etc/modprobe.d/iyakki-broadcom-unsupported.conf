# KI-094: Broadcom BCM4360-family Wi-Fi cards (2013 to 2015 Macs, PCI 14e4:43a0 and friends) have no open driver. The old b43 driver
# finds them and fails at every boot with "FOUND UNSUPPORTED PHY" (error -95). These drivers are modules here and stay out of the
# automatic loading; a person who installs a driver pack of their own (which carries the same lines) is not affected, and a
# `modprobe <name>` by hand still works. Needs the next image (it is a file in the image, not a kernel change).
blacklist b43
blacklist b43legacy
blacklist brcmsmac
blacklist bcma
blacklist ssb
