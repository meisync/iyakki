# IYAKKI network configuration. Ethernet interfaces use DHCP automatically.
#
# Join a WiFi network (WPA2/WPA3-personal). Omit wifi.psk for an open network.
# wifi.ssid = MyNetwork
# wifi.psk  = my passphrase (8..63 chars)
#
# Static address instead of DHCP for one interface:
# static.eth0 = 192.168.1.50/24 gw 192.168.1.1
# dns = 1.1.1.1
