set default="0"
set timeout="3"

menuentry "IYAKKI" {
	linux /Image console=tty0 console=ttyAMA0,115200
	initrd /rootfs.cpio.gz
}

menuentry "IYAKKI - hardware check (keyboard, mouse, touch, display)" {
	linux /Image console=tty0 console=ttyAMA0,115200 iyakki.hwcheck=1
	initrd /rootfs.cpio.gz
}

menuentry "IYAKKI - safe graphics (simple framebuffer, no GPU drivers)" {
	linux /Image console=tty0 console=ttyAMA0,115200 modprobe.blacklist=virtio_gpu,amdgpu,nouveau,panfrost,vc4
	initrd /rootfs.cpio.gz
}

menuentry "IYAKKI (verbose, boot self-test, power off)" {
	linux /Image console=tty0 console=ttyAMA0,115200 iyakki.selftest=1
	initrd /rootfs.cpio.gz
}

menuentry "IYAKKI - remote diagnostics (SSH, keys only)" {
	linux /Image console=tty0 console=ttyAMA0,115200 iyakki.ssh=1
	initrd /rootfs.cpio.gz
}

menuentry "IYAKKI - also in a browser (HTTPS on port 8443)" {
	linux /Image console=tty0 console=ttyAMA0,115200 iyakki.web=1
	initrd /rootfs.cpio.gz
}
