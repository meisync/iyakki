# Console order matters: the LAST console= that exists becomes /dev/console. QEMU and real boards have the PL011 (ttyAMA0) and no virtio console, so they keep ttyAMA0; Apple Virtualization (Lima vz) has only the virtio console (hvc0), the others are skipped there and hvc0 shows the boot (KI-1015).
set default="0"
set timeout="3"

menuentry "IYAKKI" {
	linux /Image console=tty0 console=ttyAMA0,115200 console=hvc0
	initrd /rootfs.cpio.gz
}

menuentry "IYAKKI - hardware check (keyboard, mouse, touch, display)" {
	linux /Image console=tty0 console=ttyAMA0,115200 console=hvc0 iyakki.hwcheck=1
	initrd /rootfs.cpio.gz
}

menuentry "IYAKKI - safe graphics (simple framebuffer, no GPU drivers)" {
	linux /Image console=tty0 console=ttyAMA0,115200 console=hvc0 modprobe.blacklist=virtio_gpu,amdgpu,nouveau,panfrost,vc4
	initrd /rootfs.cpio.gz
}

menuentry "IYAKKI (verbose, boot self-test, power off)" {
	linux /Image console=tty0 console=ttyAMA0,115200 console=hvc0 iyakki.selftest=1
	initrd /rootfs.cpio.gz
}

menuentry "IYAKKI - remote diagnostics (SSH, keys only)" {
	linux /Image console=tty0 console=ttyAMA0,115200 console=hvc0 iyakki.ssh=1
	initrd /rootfs.cpio.gz
}

menuentry "IYAKKI - also in a browser (HTTPS on port 8443)" {
	linux /Image console=tty0 console=ttyAMA0,115200 console=hvc0 iyakki.web=1
	initrd /rootfs.cpio.gz
}
