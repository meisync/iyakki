# One FAT EFI system partition holding GRUB, the kernel and the initramfs: boots on any UEFI firmware
# (QEMU/UTM virt machines, ARM64 boards). Attach the resulting disk image to the VM.
image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}
		file Image {
			image = "Image"
		}
		file rootfs.cpio.gz {
			image = "rootfs.cpio.gz"
		}
	}

	size = 256M
}

image iyakki-aarch64.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition esp {
		image = "efi-part.vfat"
		partition-type-uuid = U
		offset = 1M
		bootable = true
	}
}
