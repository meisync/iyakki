# One FAT EFI system partition holding GRUB, the kernel and the initramfs: boots on any UEFI firmware
# (QEMU/UTM virt machines, ARM64 boards). Attach the resulting disk image to the VM.
image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}
		file Image {
			image = "Image"
		}
		file rootfs.cpio.gz {
			image = "rootfs.cpio.gz"
		}
	}

	size = 256M
}

image iyakki-aarch64.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition esp {
		image = "efi-part.vfat"
		partition-type-uuid = U
		offset = 1M
		bootable = true
	}
}

# The install template (F-INST-28): the same boot files as a bootable stick that can install itself, with a data partition marked for
# IYAKKI to format on first boot (the same marker the x86 template carries: 1 MiB, starting with "IYAKKI-FORMAT-ME-v1" and a NUL; see
# post-image.sh). `iyakki-usb` stretches the data partition to fill the stick. Layout: GPT, partition 1 the boot volume (FAT32
# IYAKKI-BOOT, EFI System type), partition 2 the data marker (Linux filesystem type). Not booted yet in a VM or on a machine.
image iyakki-boot-aarch64.vfat {
	vfat {
		label = "IYAKKI-BOOT"
		extraargs = "-F 32"
		file EFI {
			image = "efi-part/EFI"
		}
		file Image {
			image = "Image"
		}
		file rootfs.cpio.gz {
			image = "rootfs.cpio.gz"
		}
	}

	size = 256M
}

image iyakki-install-aarch64.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		image = "iyakki-boot-aarch64.vfat"
		partition-type-uuid = U
		offset = 1M
		bootable = true
	}

	partition data {
		image = "data-marker.img"
		partition-type-uuid = L
	}
}
