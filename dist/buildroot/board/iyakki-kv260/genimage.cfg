# SD-card image for the AMD Kria KV260 (MBR; partition 1 = FAT32 IYAKKI-BOOT, bootable, with extlinux/extlinux.conf, the kernel, the
# initramfs and the device trees; partition 2 = the data marker IYAKKI formats on first boot, stretched to fill the card by
# dist/buildroot/kv260-write-sd.sh). No bootloader and no vendor blob is on the card: the board's QSPI firmware does the booting.
image boot.vfat {
	vfat {
		label = "IYAKKI-BOOT"
		extraargs = "-F 32"
		file Image {
			image = "Image"
		}
		file rootfs.cpio.gz {
			image = "rootfs.cpio.gz"
		}
		file extlinux/extlinux.conf {
			image = "extlinux.conf"
		}
		file board {
			image = "board-kv260"
		}
		file dtb {
			image = "kv260-dtb"
		}
	}

	size = 256M
}

image iyakki-kv260.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition boot {
		image = "boot.vfat"
		partition-type = 0xC
		offset = 1M
		bootable = true
	}

	partition data {
		image = "data-marker.img"
		partition-type = 0x83
	}
}
