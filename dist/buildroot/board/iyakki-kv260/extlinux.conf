# Read by the board's own U-Boot (primary boot firmware in the SOM's QSPI flash) from the SD card's FIRST bootable FAT partition:
# /extlinux/extlinux.conf (also found in /boot/extlinux/). The DEFAULT entry "iyakki-dtb" passes the device tree for carrier card
# rev B from the SD card: on the KV260 starter kit with rev B the board's own tree (entry "iyakki", no `fdt` line) gives no display
# (KI-1031). The entry "iyakki" keeps U-Boot's own device tree, for a board where it works. Serial: PS UART1 = ttyPS1, 115200 8N1
# (the micro-USB connector). The LAST console= word becomes /dev/console, so the serial port is last. Menu times are in tenths of a second.
menu title IYAKKI (AMD Kria KV260)
default iyakki-dtb
timeout 30
prompt 1

label iyakki-dtb
  menu label IYAKKI (carrier card rev B, default)
  linux /Image
  initrd /rootfs.cpio.gz
  fdt /dtb/zynqmp-smk-k26-revA-sck-kv-g-revB.dtb
  append console=tty0 console=ttyPS1,115200 earlycon clk_ignore_unused panic=20

label iyakki
  menu label IYAKKI (the board's own device tree: may show no display)
  linux /Image
  initrd /rootfs.cpio.gz
  append console=tty0 console=ttyPS1,115200 earlycon clk_ignore_unused panic=20

label iyakki-dtb-reva
  menu label IYAKKI (device tree for carrier card rev A)
  linux /Image
  initrd /rootfs.cpio.gz
  fdt /dtb/zynqmp-smk-k26-revA-sck-kv-g-revA.dtb
  append console=tty0 console=ttyPS1,115200 earlycon clk_ignore_unused panic=20

label iyakki-selftest
  menu label IYAKKI (verbose, boot self-test, then power off)
  linux /Image
  initrd /rootfs.cpio.gz
  append console=tty0 console=ttyPS1,115200 earlycon clk_ignore_unused iyakki.selftest=1

label iyakki-ssh
  menu label IYAKKI (remote diagnostics, SSH with keys only)
  linux /Image
  initrd /rootfs.cpio.gz
  append console=tty0 console=ttyPS1,115200 earlycon clk_ignore_unused iyakki.ssh=1

label iyakki-web
  menu label IYAKKI (also in a browser, HTTPS on port 8443)
  linux /Image
  initrd /rootfs.cpio.gz
  append console=tty0 console=ttyPS1,115200 earlycon clk_ignore_unused iyakki.web=1
