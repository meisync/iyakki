<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>IYAKKI full-browser test</title>
<style>
 body{margin:0;font:20px/1.3 sans-serif;background:#0b1020;color:#e8ecff}
 h1{margin:12px 16px;font-size:28px}
 .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:80px 80px;gap:10px;margin:0 16px}
 .grid div{border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#001}
 .grid div:nth-child(1){background:#ff6b6b}.grid div:nth-child(2){background:#feca57}.grid div:nth-child(3){background:#1dd1a1}
 .grid div:nth-child(4){background:#54a0ff;grid-row:span 2}.grid div:nth-child(5){background:#c56cf0;grid-column:span 2}.grid div:nth-child(6){background:#fff}
 .row{display:flex;gap:16px;margin:12px 16px;align-items:flex-start}
 canvas,video{background:#000;border:2px solid #4b5a9a;border-radius:8px}
 #status{font:16px monospace;white-space:pre;margin:8px 16px}
 .fonts span{margin-right:18px}
</style></head><body>
<h1>IYAKKI full-browser test page</h1>
<div class="grid"><div>grid 1</div><div>grid 2</div><div>grid 3</div><div>span rows</div><div>span cols</div><div>grid 6</div></div>
<div class="row">
  <canvas id="c" width="420" height="240"></canvas>
  <video id="v" width="420" height="240" muted loop autoplay playsinline src="test.webm"></video>
</div>
<div class="fonts" style="margin:0 16px"><span style="font-family:serif">Serif text</span><span style="font-family:sans-serif">Sans text</span><span style="font-family:monospace">Mono text</span><span>Unicode: ✓ → é ñ 日本語</span></div>
<div id="status">starting…</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let frames=0,t0=performance.now();
function draw(t){frames++;x.fillStyle='#0b1020';x.fillRect(0,0,420,240);
 for(let i=0;i<12;i++){const a=t/700+i*Math.PI/6;x.fillStyle='hsl('+((i*30+t/10)%360)+',80%,60%)';
  x.beginPath();x.arc(210+Math.cos(a)*90,120+Math.sin(a)*90,16,0,7);x.fill();}
 x.fillStyle='#fff';x.font='18px sans-serif';x.fillText('canvas frame '+frames,12,24);requestAnimationFrame(draw);}
requestAnimationFrame(draw);
const v=document.getElementById('v'),s=document.getElementById('status');
function report(){const o={frames:frames,fps:Math.round(frames*1000/(performance.now()-t0)),vt:+v.currentTime.toFixed(2),rs:v.readyState,paused:v.paused,
  err:v.error?v.error.code+':'+v.error.message:null,vw:v.videoWidth,
  webm_vp9:v.canPlayType('video/webm; codecs="vp9"'),webm_av1:v.canPlayType('video/mp4; codecs="av01.0.05M.08"'),mp4_h264:v.canPlayType('video/mp4; codecs="avc1.42E01E"'),opus:v.canPlayType('audio/webm; codecs="opus"'),
  mse:typeof MediaSource!=='undefined'&&MediaSource.isTypeSupported('video/webm; codecs="vp9"'),ua:navigator.userAgent};
 s.textContent=JSON.stringify(o,null,1);fetch('report?'+encodeURIComponent(JSON.stringify(o))).catch(()=>{});}
setInterval(report,2000);v.play().catch(e=>{s.textContent='play() rejected: '+e});
</script></body></html>
