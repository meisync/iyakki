# Shape only: the real Secret is made by README.md step 2 from host files, so the repository never holds a secret.
#   kubectl -n iyakki-store create secret generic store-secrets \
#     --from-file=catalog-seed=$HOME/iyakki-work/store-k3s/secrets/catalog-seed \
#     --from-file=admin-token=$HOME/iyakki-work/store-k3s/secrets/admin-token
apiVersion: v1
kind: Secret
metadata:
  name: store-secrets
  namespace: iyakki-store
  labels:
    app.kubernetes.io/part-of: iyakki-store
type: Opaque
stringData:
  catalog-seed: "REPLACE: 64 hex characters (the catalog key is derived from it inside the pod)"
  admin-token: "REPLACE: 64 hex characters (the publish/administrator token)"
