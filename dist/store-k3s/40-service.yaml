apiVersion: v1
kind: Service
metadata:
  name: iyakki-store
  namespace: iyakki-store
  labels:
    app.kubernetes.io/name: iyakki-store
    app.kubernetes.io/part-of: iyakki-store
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: iyakki-store
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: iyakki-store-nodeport
  namespace: iyakki-store
  labels:
    app.kubernetes.io/name: iyakki-store
    app.kubernetes.io/part-of: iyakki-store
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: iyakki-store
  ports:
    - { name: http, port: 8080, targetPort: http, nodePort: 30580 }
