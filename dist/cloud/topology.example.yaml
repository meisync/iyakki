# IYAKKI cloud topology file (PLAN, not read by any program yet; see docs/development/CLOUD-TOPOLOGY-PLAN.md).
# One file per installation. `iyakki cloud plan --topology topology.yaml` will check it and print the manifests per cluster.
# Nothing secret belongs here: every credential is a reference `vault:<ns>/<name>` resolved by the CONTROL plane.
schema: 1

# single : today. One pod per tenant, JSON files on the tenant volume. No database. Planes are modules of one process.
# split2 : control plane + execution plane. Workflow state still on the control plane's volume or its database.
# split3 : control + workflow + execution; workflow state in the shared database.
topology: split3

planes:
  control:                       # identity, tenant config, roles, approver lists, vault service
    scope: tenant                # installation | tenant | team. tenant (default): one control deployment per tenant.
                                 # installation: one for everything (cheapest, weakest). team: ACCEPTED BY THE PARSER, but `iyakki cloud
                                 # plan` answers "control.scope team is not built yet; use tenant or installation". A scope is an opaque
                                 # (kind, id) pair everywhere (tokens, certificate names, table keys), so team can be added later.
    cluster: control-a           # a name from `clusters:` below
    namespace: iyakki-control
    replicas: 2                  # stateless API; the vault service keeps one writer (lease) unless the database backs it
  workflow:                      # scheduler, flow engine control, approvals, notification queue, run history
    cluster: workflow-a
    namespace: iyakki-workflow
    replicas: 2                  # all replicas work; leases and SKIP LOCKED decide who does what
  execution:                     # sandbox Jobs, CLI runs, optional IYAKKI browser sessions
    clusters: [sandbox-a, sandbox-b]   # several allowed; a team/environment binding picks one
    tenant_isolation: namespace  # namespace | cluster   (cluster = one execution cluster per tenant, listed in `tenants`)
    # Execution clusters use the same binding shape as tenant `k3s.cluster` items, with purpose: sandbox (platform-owned in v1).
    browser_sessions: false      # the browser pods are an extra, off by default

clusters:
  control-a:
    kubeprofile: prod-control    # a kube profile name (kubeprofiles.rs); the kubeconfig/token live in the CONTROL vault
    credential: vault:k3s.cluster/control-a-credential
  workflow-a:
    kubeprofile: prod-workflow
    credential: vault:k3s.cluster/workflow-a-credential
  sandbox-a:
    kubeprofile: prod-sandbox-a
    credential: vault:k3s.cluster/sandbox-a-credential
    region: eu-1
  sandbox-b:
    kubeprofile: prod-sandbox-b
    credential: vault:k3s.cluster/sandbox-b-credential
    region: eu-2

# Only used when topology is split3 (split2 may use it too, for a shared control database).
database:
  kind: postgres                 # file | sqlite | postgres   (single defaults to file; split3 requires postgres)
  host: pg.workflow-a.svc        # a service the OPERATOR runs (managed, or their own/HA operator such as CloudNativePG); the default
  # Optional: let `iyakki cloud plan` also emit an in-cluster PostgreSQL (StatefulSet + headless Service + PVC, backup CronJob,
  # restore-drill CronJob, NetworkPolicy). The image is pulled at deploy time from YOUR registry; IYAKKI does not ship PostgreSQL.
  in_cluster:
    enabled: false
    image: registry.example.org/postgres@sha256:REPLACE_WITH_DIGEST
    storage_class: local-path    # k3s default; node-local, Delete reclaim: use a Retain class in production
    size: 20Gi
    resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 2Gi}}
    backup: {schedule: "0 2 * * *", pvc_size: 40Gi, storage_class: local-path, keep_daily: 7, keep_weekly: 4, offsite: ""}
    drill: {schedule: "0 4 1 * *"}          # monthly restore drill into a throw-away pod
    # credentials are generated by `iyakki cloud plan` into a Secret and never printed
  port: 5432
  name: iyakki
  user: iyakki_workflow          # one database role per plane; see the plan, section 4.5
  password: vault:db/workflow-password
  # Certificate verification is FORCED. Modes, strongest first (plan section 2.4b); plaintext does not exist:
  #   verify-full  (default) chain + host name
  #   verify-ca    chain only; for in-cluster services addressed by IP; warned at plan time
  #   pin-only     trust exactly one certificate/SPKI fingerprint (the right answer for a self-signed database certificate)
  #   unverified   BREAK-GLASS, admin only, see `tls_break_glass` below; never the default
  tls: verify-full
  # pin: sha256:REPLACE_WITH_SPKI_FINGERPRINT     # use with `tls: pin-only` (two values allowed while rotating)
  # tls_break_glass:                              # only an administrator; never from an env variable or CLI flag; signed topology file or admin API
  #   connection: database
  #   reason: "managed service presents a broken chain; ticket 1234, vendor fix expected"   # required, >= 20 characters
  #   expires: 7d                                 # default 7d, bounds 1h..30d; then it reverts to the previous strict mode and admins are notified
  #   # refused for split3/production unless tenant policy tls.allow_unverified: true; then max 7d and a second admin approves
  tls_adapter: iyakki-pg-tls     # our own thin rustls adapter (secure-package standard, plan section 2.4a)
  channel_binding: prefer        # prefer | require (SCRAM-SHA-256-PLUS when the client supports it)
  ca: vault:db/ca-pem
  pool: {min: 2, max: 16}
  retention_days: {runs: 90, notifications: 30, audit: 400}

# Service identities between planes (mutual TLS). `internal-ca` is made by `iyakki cloud plan --init-ca` and its key goes to the control vault.
mtls:
  ca: vault:pki/internal-ca
  leaf_lifetime_hours: 24        # leaf certificates are short-lived and renewed by the control plane
  run_token_ttl_secs: 900        # signed run tokens for sandbox pods

# When the control plane (or execution) is down: queue durably and deliver late with a warning. Schedules may override.
late:
  late_policy: deliver_late      # deliver_late | skip | fail
  max_late: 6h                   # four-eyes production environments: 1h with on_expired: skip (per-schedule overrides allowed)
  on_expired: notify             # skip | notify
  catch_up: one                  # one | all | none  (collapse of missed fires of the same schedule)
  release_rate_per_sec: 5        # throttle when work is released after an outage
  allow_cached: false            # per schedule opt-in only; never for four-eyes environments or runs that need a secret

# Operations: plane health dashboard, admin actions, read-only assistant tools (ops.*; fixes only as approval requests).
ops:
  health_interval_secs: 10
  assistant_tools: assisted_fix  # off | read_only | assisted_fix (plan + per-step admin click; destructive steps need the click)
  assisted_fix_idle_timeout: 10m # admin may override, bounds 1m..60m
  destructive_actions_need_approval: true

# What sandbox pods may reach (a NetworkPolicy per execution namespace).
egress:
  proxy: iyakki-egress.iyakki-sandbox.svc:3128
  result_endpoint: https://workflow.example.org/internal/v1/results
  # nothing else: no vault, no database, no control API, no cluster-internal ranges

# Tenant placement. Without an entry a tenant uses the defaults above.
tenants:
  acme:
    execution: sandbox-a
  globex:
    execution: sandbox-b
    isolation: cluster
