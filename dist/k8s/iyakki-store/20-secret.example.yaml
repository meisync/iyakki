# Shape only. The real Secret is made from files on the publisher's PC (never from this repository):
#   S=$HOME/iyakki-work/build-store/secrets      # mode 700; files mode 600; made with `openssl rand -hex 32`
#   kubectl -n iyakki-store create secret generic store-secrets \
#     --from-file=publish-token=$S/publish.token --from-file=read-token=$S/read.token --from-file=catalog-seed=$S/catalog-seed
# The UPDATE signing key is not in this Secret and never enters the cluster; only its public half is an argument of the Deployment.
apiVersion: v1
kind: Secret
metadata:
  name: store-secrets
  namespace: iyakki-store
type: Opaque
stringData:
  publish-token: "REPLACE: 64 hex characters (publish and administrator token)"
  read-token: "REPLACE: 64 hex characters (the one string teammates get)"
  catalog-seed: "REPLACE: 64 hex characters (the app catalog key is derived from it inside the pod)"
