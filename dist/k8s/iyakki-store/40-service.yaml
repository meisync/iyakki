# NodePort 30580 on every address of the node: reachable on the LAN at http://<this PC>:30580 (plain HTTP; everything that matters is
# signed or hash-checked, see docs/development/BUILD-SHARING.md). The PC's address is DHCP: scripts take the URL as a parameter.
apiVersion: v1
kind: Service
metadata:
  name: iyakki-store
  namespace: iyakki-store
  labels:
    app.kubernetes.io/name: iyakki-store
    app.kubernetes.io/part-of: iyakki-store
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: iyakki-store
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30580
