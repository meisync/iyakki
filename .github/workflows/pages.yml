name: pages
# Deploys the committed site/ folder to GitHub Pages (built and checked before it is committed).
# Runs on pushes to release/** branches and by hand. The site has no script and loads nothing from another site.
# TODO(pin): the actions below are pinned by major tag, like ci.yml, because a full commit SHA could not be verified offline
# when this file was written. Replace each tag with its full commit SHA (look it up on the action's releases page) before relying on it.
on:
  push:
    branches: ['release/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the site folder is built and checked by the maintainers before it is committed (python3 dist/site/build-site.py and check-site.py);
      # CI deploys what is committed instead of rebuilding it from FEATURES.md, so the page can show the development line without publishing the matrix
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
